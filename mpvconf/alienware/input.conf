# ==========================================================
# AIOStreams Desktop / libmpv Custom Keybindings
# ==========================================================

# 1. Minimal Processing Baseline A/B Comparison
Ctrl+Shift+R apply-profile "purist-reference" ; show-text "Profile: Purist Baseline (No Shaders/Deband)" 2000
Ctrl+Shift+U apply-profile "purist-reference" restore ; show-text "Profile: Custom Pipeline Restored" 2000

# 2. Live HDR Tone-Mapping Curve Cycle
Ctrl+Shift+T cycle-values tone-mapping "spline" "bt.2390" "bt.2446a" ; show-text "HDR Tone-Mapping: ${tone-mapping}" 2000

# 3. Live HDR Peak Percentile A/B Toggle
Ctrl+Shift+H cycle-values hdr-peak-percentile "99.95" "99.8" "99.995" ; show-text "HDR Peak Percentile: ${hdr-peak-percentile}" 2000

# 4. Live Deband Toggle
Ctrl+Shift+D cycle deband ; show-text "Deband: ${deband}" 2000

# 5. Live Neural Upscaler A/B Toggle (Alienware: ArtCNN C4F32 vs. FSRCNNX 16-0-4-1)
Ctrl+Shift+A change-list glsl-shaders set "~~/shaders/01_CfL_Prediction.glsl;~~/shaders/02_ArtCNN_C4F32.glsl;~~/shaders/03_SSimDownscaler.glsl" ; show-text "Upscaler: ArtCNN C4F32" 2000
Ctrl+Shift+F change-list glsl-shaders set "~~/shaders/01_CfL_Prediction.glsl;~~/shaders/02_FSRCNNX_x2_16-0-4-1.glsl;~~/shaders/03_SSimDownscaler.glsl" ; show-text "Upscaler: FSRCNNX 16-0-4-1" 2000
