# mpv options for Alienware m16 R1
# Hardware: i9-13900HX + RTX 4070 8GB VRAM + 64GB DDR5
# Validated for AIOStreams Desktop 0.26.1+ (libmpv + mpv 0.42.0-dev)
# Purpose: calibrated starting point for image quality and A/B comparison.
# Facts below distinguish measured behavior from subjective preferences.
# Displays:
#   - Integrated Panel: BOE0B04 / NE160QDM-NZ2 (16" IPS QHD+ 2560x1600 240Hz, 10-bit 8+FRC, ~300 nits typ.)
#   - External Monitor: Philips 236V4 / PHLC0B3 (23" TN FHD 1920x1080 60Hz, 8-bit 6+FRC, ~250 nits typ. max)
#   - External 4K TV: LG 55QNED82 / 55QNED82ASG (55" QNED 4K 3840x2160 120Hz, 10-bit, HDR10/HLG/DV)
# App Integration Notes:
#   - Video output (gpu-next with gpu fallback) is initialized by AIOStreams Desktop on Windows.
#   - Hardware decoding, audio channels, passthrough & dialogue boost are managed in AIOStreams Settings.
#   - Keep AIOStreams "Anime upscaling" OFF while custom GLSL shaders are active.
#   - Do not copy this file literally by text import: the mpv option syntax is plain text.

# ==========================================================
# Rendering & FP32 Intermediate Pipeline (D3D11)
# Choices: preserve intermediate precision and reduce quantization while the
# RTX 4070 remains within the measured frame budget.
# These settings affect processing behavior, not source detail recovery.
# ==========================================================
gpu-api=d3d11
gpu-context=d3d11
d3d11-output-format=rgb10_a2
fbo-format=rgba32f
swapchain-depth=6
demuxer-thread=yes
# Verify in AIOStreams logs that this build accepts "auto". If it reports an
# invalid option, use "yes" or "no" explicitly instead.
deinterlace=auto

# ==========================================================
# High-Precision Scaling & Floyd-Steinberg 10-Bit Dithering
# Choice: maximizes edge definition and detail for a high-quality dGPU setup.
# Trade-off: Lanczos sharpness can reveal ringing or halos on thin/contrasty edges.
# The profile below "purist-reference" uses a less aggressive Lanczos variant.
# Verified in your tests: these settings ran without dropped frames on tested
# 1080p SDR and 4K DV playback. Visual preference still requires A/B comparison.
# ==========================================================
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
# 0.7 is intentionally conservative: it suppresses ringing without removing
# as much detail as stronger anti-ringing settings.
scale-antiring=0.7
cscale-antiring=0.7
correct-downscaling=yes
# Linear/sigmoid variants are intentionally disabled here. They remain available
# for isolated A/B tests if down/upscaling artifacts or tone-mapped gradients
# are judged visually objectionable.
linear-downscaling=no
sigmoid-upscaling=no

dither-depth=10
dither=error-diffusion
# Floyd-Steinberg distributes quantization error and is retained for 10-bit
# gradients. Its moving-pixel structure should be judged in motion, not only
# on paused frames.
error-diffusion=floyd-steinberg

# ==========================================================
# Motion & Display Sync (Audio Clock Sync)
# Fidelity choice: preserve source cadence and avoid synthetic frame insertion.
# This does not itself enable G-SYNC/VRR; Windows/G-SYNC/VRR must be configured
# separately. 24 fps may still show judder on fixed 60 Hz panels.
# ==========================================================
video-sync=audio
interpolation=no

# ==========================================================
# Multi-Pass Selective Debanding
# Choice: retain for compressed gradients, especially 4K streams.
# Three passes can improve banding, but may soften very fine grain or texture.
# The debanding A/B shortcut should decide whether this setting is beneficial.
# Verified in your tested Alienware playback: no dropped frames.
# ==========================================================
deband=yes
deband-iterations=3
deband-threshold=24
deband-range=12
deband-grain=6

# ==========================================================
# Color Calibration & HDR Tone-Mapping (SDR Panel Targets)
# Spline was selected for the current preference based on HDR-to-SDR A/B tests.
# It is not calibration data: panel/Philips targets remain approximate until
# measured at the actual brightness used in Windows.
# Perceptual gamut mapping was retained as a balanced way to protect saturation
# and preserve in-gamut detail while compressing colors outside the target gamut.
# ==========================================================
icc-profile-auto=no
target-colorspace-hint=no
tone-mapping=spline
gamut-mapping-mode=perceptual
hdr-compute-peak=yes
# 99.8 follows only the brightest part of the scene less conservatively than
# 99.995. It can preserve average highlight brightness better, but risks losing
# isolated highlight detail. Test with the pct shortcut before finalizing.
hdr-peak-percentile=99.8

# ==========================================================
# Manual RAM Cache (Overrides AIOStreams 1 GiB Auto-Cache)
# This setting is intentionally manual for long/heavy remuxes and network
# buffering. AIOStreams suppresses its automatic cache when it finds
# "demuxer-max-bytes" in mpv.conf, even in a comment.
# The values are upper limits, not RAM reserved permanently.
# 4 GiB forward / 2 GiB backward is the calibrated starting point for 64 GB RAM.
# Removing both lines restores AIOStreams automatic cache behavior.
# ==========================================================
cache=yes
cache-on-disk=no
demuxer-max-bytes=4GiB
demuxer-max-back-bytes=2GiB

# ==========================================================
# Track Preferences & Audio Downmix / Volume Safety
# Track choices and audio downmix behavior are independent of channel/passthrough
# controls in AIOStreams. Normalize-downmix protects against clipping only;
# it is not a substitute for the app's dialogue boost or night-mode processing.
# ==========================================================
alang=eng,pt-BR,por,jpn
slang=eng,pt-BR,por
subs-with-matching-audio=yes
sub-auto=fuzzy
audio-normalize-downmix=yes
# Pitch correction is relevant mainly for playback-speed changes.
audio-pitch-correction=yes
# Amplifies the player volume but cannot restore lost detail and may clip.
volume-max=120

# ==========================================================
# Neural & Perceptual GLSL Shader Chain
# This chain is optional image interpretation, not a substitute for the source.
# It is most applicable to lower-resolution sources and may alter 4K content.
# CfL: chroma reconstruction
# FSRCNNX: neural upscaling
# SSimDownscaler: quality-oriented reduction after scaling
# During A/B tests, keep AIOStreams "Anime upscaling" disabled to avoid stacking.
# ==========================================================
glsl-shaders-append="~~/shaders/01_CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/02_FSRCNNX_x2_16-0-4-1.glsl"
glsl-shaders-append="~~/shaders/03_SSimDownscaler.glsl"

# ==========================================================
# Conditional & Manual Profiles
# (Must always remain at the very bottom of mpv.conf)
# Profiles are evaluated in priority order; copy-equal modes preserve runtime
# restoration behavior. A profile will never prove itself superior by
# naming alone: compare with visible 1080p/4K representative scenes.
# ==========================================================

# 1. High-FPS Guard (Lightweight pipeline on >=48fps streams)
# Purpose: reduce expensive processing when FPS is 48 or higher.
# It removes debanding, peak detection and the neural/perceptual chain, retaining
# only CfL. This favors frame-headroom over maximum source enhancement.
# The FPS condition is a heuristic because estimated/container FPS can differ.
[high-fps-guard]
profile-desc="Use lightweight pipeline with CfL only at >=48fps"
profile-cond=math.max(get("container-fps", 24), get("estimated-vf-fps", 24)) >= 48
profile-restore=copy-equal
deband=no
hdr-compute-peak=no
glsl-shaders-clr
glsl-shaders-append="~~/shaders/01_CfL_Prediction.glsl"
error-diffusion=sierra-lite

# 2. Laptop Panel HDR Tone-Mapping Peak (BOE0B04 / NE160QDM-NZ2, ~300 nits typ.)
# Purpose: use the panel's approximate peak for HDR-to-SDR conversion.
# 300 nits is based on typical panel characteristics, not on a calibrated
# per-window brightness measurement. Adjust target-peak if Windows brightness,
# OSD brightness or the real measured headroom changes.
[alienware-hdr-to-sdr]
profile-desc="Set 300-nit tone-mapping peak for HDR content on 2560px displays"
profile-cond=(p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg") and get("display-width", 0) == 2560
profile-restore=copy-equal
target-peak=300

# 3. External 1080p Monitor HDR Tone-Mapping Peak (Philips 236V4 / PHLC0B3, ~250 nits typ. max)
# Purpose: approximate SDR conversion peak for the Philips panel.
# Resolution/frequency identify this profile; they do not identify the exact
# monitor. Use it only with the Philips target and adjust for its real brightness.
[philips-236v4-hdr-to-sdr]
profile-desc="Set 250-nit tone-mapping peak for HDR content on 1080p <=75Hz displays"
profile-cond=(p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg") and get("display-width", 0) == 1920 and get("display-fps", 60) <= 75
profile-restore=copy-equal
target-peak=250

# 4. Dedicated HDR10+ Dynamic Metadata (Heuristic Dolby Vision Exclusion)
# Purpose: honor HDR10+ dynamic metadata when a positive profile can be found.
# This heuristic excludes the Dolby Vision path before selecting ST 2094-40.
# It was tested for non-triggering behavior in two hybrid DV streams, but a
# positive HDR10+ test is still needed for full validation.
[auto-hdr10plus]
profile-desc="Use ST 2094-40 dynamic metadata for HDR10+ when no Dolby Vision profile is reported"
profile-cond=p["video-params/gamma"] == "pq" and p["video-params/colormatrix"] ~= "dolbyvision" and get("current-tracks/video/dolby-vision-profile", 0) == 0 and get("video-params/scene-max-r", 0) > 0
profile-restore=copy-equal
tone-mapping=st2094-40
hdr-compute-peak=no

# 5. External 4K TV Profile (LG 55QNED82ASG 4K 120Hz — configure Atmos passthrough in AIOStreams UI)
# Purpose: provide an HDR/HDR hinting and disable artificial debanding on the TV.
# This profile detects any 4K <=120 Hz display by resolution/fps; it does not
# cryptographically or physically identify the LG model.
# target-peak=auto is appropriate only for the HDR-native TV path. It must not
# be assumed to replace Windows HDR configuration or calibrated SDR conversion.
[lg-tv-hdr-atmos]
profile-desc="Enable static HDR output hint on 4K <=120Hz displays"
profile-cond=get("display-width", 0) >= 3840 and get("display-fps", 60) <= 120
profile-restore=copy-equal
video-sync=audio
interpolation=no
deband=no
target-colorspace-hint=auto
target-colorspace-hint-mode=source
target-peak=auto

# 6. Minimal Processing Comparison Mode (Ctrl+Shift+R to apply / Ctrl+Shift+U to restore)
# Purpose: compare a minimally processed image against the normal chain.
# This is a no-calibration comparison profile, not a "studio reference".
# It does not mean "more faithful" by itself: less sharpening/debanding may
# reveal source compression, grain or banding that was previously hidden.
# profile-restore=copy lets Ctrl+Shift+U restore values from immediately before
# applying this profile. Reopen/reload if a conditional profile must re-evaluate.
[purist-reference]
profile-restore=copy
profile-desc="Minimal processing: spline tone-mapping, no shaders, no deband, fruit dither"
scale=ewa_lanczos
cscale=ewa_lanczos
scale-antiring=0.5
cscale-antiring=0.5
tone-mapping=spline
hdr-peak-percentile=99.995
deband=no
dither=fruit
glsl-shaders-clr
