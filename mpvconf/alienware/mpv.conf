# mpv options for Alienware m16 R1
# Hardware: i9-13900HX + RTX 4070 8GB VRAM + 64GB DDR5
# Validated for AIOStreams Desktop / SELection (libmpv + gpu-next)
# Displays: Integrated 240Hz QHD+ BOE0B04, Philips 236V4 1080p 60Hz & LG 55QNED82 4K TV
# Audio: Integrated Speakers, Sony WH-1000XM5 & LG SP9A Atmos Soundbar (HDMI)

# ==========================================================
# Rendering & FP32 Intermediate Pipeline
# ==========================================================
vo=gpu-next
# FP32/libplacebo rendering pipeline; explicit D3D11 output for Windows.
gpu-api=d3d11
gpu-context=d3d11
d3d11-output-format=rgb10_a2
fbo-format=rgba32f
swapchain-depth=6
hwdec=d3d11va
demuxer-thread=yes
# Let mpv enable deinterlacing only when the stream reports interlaced fields.
deinterlace=auto

# ==========================================================
# High-Precision Scaling & Floyd-Steinberg 10-Bit Dithering
# ==========================================================
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
# Antiringing set slightly higher than Lenovo due to the dGPU and detail-oriented chain.
scale-antiring=0.7
cscale-antiring=0.7
correct-downscaling=yes
linear-downscaling=no
sigmoid-upscaling=no

dither-depth=10
# 10-bit target for the laptop panel and error diffusion for finer 10-bit gradient output.
dither=error-diffusion
error-diffusion=floyd-steinberg

# ==========================================================
# Motion & Display Sync (Audio Clock Sync for VRR / G-SYNC)
# ==========================================================
video-sync=audio
interpolation=no

# ==========================================================
# Multi-Pass Selective Debanding
# ==========================================================
deband=yes
# Three passes are inexpensive on the RTX 4070 and help compressed 4K streams.
deband-iterations=3
deband-threshold=24
deband-range=12
deband-grain=6

# ==========================================================
# Color Calibration & HDR Tone-Mapping (203-nit SDR default; PQ/HLG peaks in profiles)
# ==========================================================
icc-profile-auto=no
target-colorspace-hint=no
tone-mapping=bt.2446a
gamut-mapping-mode=perceptual
# Dynamic HDR peak detection is useful on SDR remapping; disable in the TV profile only if needed.
hdr-compute-peak=yes
hdr-peak-percentile=99.8

# ==========================================================
# In-Memory Demuxer Cache Limits (Up to 6 GiB RAM, No Disk Cache)
# ==========================================================
cache=yes
cache-on-disk=no
# 4 GiB forward + 2 GiB backward, kept in RAM for the 64 GB system.
demuxer-max-bytes=4GiB
demuxer-max-back-bytes=2GiB

# ==========================================================
# Audio & Subtitles (Speakers, Sony WH-1000XM5, EN Primary)
# ==========================================================
alang=eng,pt-BR,por,jpn
slang=eng,pt-BR,por
subs-with-matching-audio=yes
sub-auto=fuzzy

audio-channels=auto-safe
audio-normalize-downmix=yes
# 1.0 dB is intentional center/dialogue emphasis when MPV/Swresample performs the downmix.
audio-swresample-o=center_mix_level=1.0
audio-pitch-correction=yes
volume-max=120

# ==========================================================
# Live-Action Neural & Perceptual GLSL Shader Chain
# ==========================================================
glsl-shaders-append="~~/shaders/01_CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/02_FSRCNNX_x2_16-0-4-1.glsl"
glsl-shaders-append="~~/shaders/03_SSimDownscaler.glsl"

# ==========================================================
# Conditional Auto-Profiles
# (Must always remain at the very bottom of mpv.conf)
# ==========================================================

# 1. High-FPS Guard (Heuristic switch to lightweight pipeline on >=48fps streams)
[high-fps-guard]
profile-desc="Use lightweight pipeline with CfL only at >=48fps"
profile-cond=math.max(get("container-fps", 24), get("estimated-vf-fps", 24)) >= 48
profile-restore=copy-equal
# Keep only the chroma pass and switch to a cheaper dithering kernel on high-FPS streams.
deband=no
hdr-compute-peak=no
glsl-shaders-clr
glsl-shaders-append="~~/shaders/01_CfL_Prediction.glsl"
error-diffusion=sierra-lite

# 2. Laptop Panel HDR Tone-Mapping Peak (300 nits, active only on HDR sources)
[alienware-hdr-to-sdr]
profile-desc="Set 300-nit tone-mapping peak for HDR content on 2560px displays"
profile-cond=(p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg") and get("display-width", 0) == 2560
profile-restore=copy-equal
# Provisional panel estimate; replace only after an actual HDR peak measurement.
target-peak=300

# 3. External 1080p Monitor HDR Tone-Mapping Peak (250 nits, active only on HDR sources)
[philips-236v4-hdr-to-sdr]
profile-desc="Set 250-nit tone-mapping peak for HDR content on 1080p <=75Hz displays"
profile-cond=(p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg") and get("display-width", 0) == 1920 and get("display-fps", 60) <= 75
profile-restore=copy-equal
# Provisional 1080p SDR-remapping estimate; does not alter SDR-native sources.
target-peak=250

# 4. Dedicated HDR10+ Dynamic Metadata (Heuristic Dolby Vision Exclusion)
[auto-hdr10plus]
profile-desc="Use ST 2094-40 dynamic metadata for HDR10+ when no Dolby Vision profile is reported"
profile-cond=p["video-params/gamma"] == "pq" and p["video-params/colormatrix"] ~= "dolbyvision" and get("current-tracks/video/dolby-vision-profile", 0) == 0 and get("video-params/scene-max-r", 0) > 0
profile-restore=copy-equal
# Heuristic: hybrid scenes reporting Dolby Vision take the Dolby Vision path instead.
tone-mapping=st2094-40
hdr-compute-peak=no

# 5. External 4K TV & Soundbar Profile (LG 55QNED82 + LG SP9A Atmos)
[lg-tv-hdr-atmos]
profile-desc="Enable static HDR output hint and WASAPI exclusive bitstream on 4K <=120Hz displays"
profile-cond=get("display-width", 0) >= 3840 and get("display-fps", 60) <= 120
profile-restore=copy-equal
video-sync=audio
interpolation=no
# TV output uses the source/display HDR metadata; avoid extra deband processing.
deband=no
target-colorspace-hint=auto
target-colorspace-hint-mode=source
target-peak=auto
ao=wasapi
audio-exclusive=yes
# Prefer native multichannel layouts, with stereo as the final compatible fallback.
audio-channels=7.1,5.1,stereo
audio-spdif=ac3,eac3,dts,dts-hd,truehd
