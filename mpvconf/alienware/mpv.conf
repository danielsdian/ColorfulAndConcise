# mpv options for Alienware m16 R1 (Maximum Quality / Unconstrained Profile)
# Hardware: i9-13900HX + RTX 4070 8GB VRAM + 64GB DDR5
# Validated for AIOStreams Desktop 0.26.1+ (libmpv + mpv 0.42.0-dev)
# Displays:
#   - Integrated Panel: BOE0B04 / NE160QDM-NZ2 (16" IPS QHD+ 2560x1600 240Hz, 10-bit 8+FRC, ~300 nits typ.)
#   - External Monitor: Philips 236V4 / PHLC0B3 (23" TN FHD 1920x1080 60Hz, 8-bit 6+FRC, ~250 nits typ. max)
#   - External 4K TV: LG 55QNED82 / 55QNED82ASG (55" QNED 4K 3840x2160 120Hz, 10-bit, HDR10/HLG/DV)
# App Integration Notes:
#   - Video output (gpu-next with gpu fallback) is initialized by AIOStreams Desktop on Windows.
#   - Hardware decoding, audio channels, passthrough & dialogue boost are managed in AIOStreams Settings.
#   - Keep AIOStreams "Super Resolution" and "Anime upscaling" OFF while custom GLSL shaders are active.

# ==========================================================
# Rendering & FP32 Intermediate Pipeline (D3D11)
# ==========================================================
gpu-api=d3d11
gpu-context=d3d11
d3d11-output-format=rgb10_a2
fbo-format=rgba32f
swapchain-depth=3
demuxer-thread=yes
deinterlace=auto

# ==========================================================
# Reference Scaling & Error-Diffusion 10-Bit Dithering
#   - scale=ewa_lanczos4sharpest + sigmoid-upscaling=yes: aggressive 4-lobe EWA
#     luma kernel for residual upscaling stages not handled by ArtCNN.
#   - cscale=ewa_lanczossharp (antiring=0.5): reference EWA chroma fallback
#     when CfL is bypassed (e.g., 4:4:4 sources).
#   - dscale=catmull_rom + linear-downscaling=yes: crisp reduction in linear
#     light paired with SSimDownscaler.
#   - dither=error-diffusion (burkes, temporal-dither=no): maximum-precision
#     multi-neighbor error diffusion without temporal crawl.
# ==========================================================
scale=ewa_lanczos4sharpest
cscale=ewa_lanczossharp
dscale=catmull_rom
scale-antiring=0.7
cscale-antiring=0.5
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

dither-depth=10
dither=error-diffusion
error-diffusion=burkes
temporal-dither=no

# ==========================================================
# Motion & Display Sync
# Preserves exact source cadence without synthetic motion interpolation.
# ==========================================================
video-sync=audio
interpolation=no

# ==========================================================
# Multi-Pass Selective Debanding
# ==========================================================
deband=yes
deband-iterations=3
deband-threshold=24
deband-range=12
deband-grain=6

# ==========================================================
# Color Calibration & libplacebo HDR Tone-Mapping (SDR Panel Targets)
# ==========================================================
icc-profile-auto=no
target-colorspace-hint=no
tone-mapping=spline
gamut-mapping-mode=perceptual
hdr-compute-peak=yes
hdr-peak-percentile=99.95
hdr-contrast-recovery=0.25
hdr-contrast-smoothness=3.5

# ==========================================================
# Manual RAM Cache (Overrides AIOStreams 1 GiB Auto-Cache)
# ==========================================================
cache=yes
cache-on-disk=no
demuxer-max-bytes=4GiB
demuxer-max-back-bytes=2GiB

# ==========================================================
# Track Preferences & Audio Downmix / Volume Safety
# ==========================================================
alang=eng,pt-BR,por,jpn
slang=eng,pt-BR,por
subs-with-matching-audio=yes
sub-auto=fuzzy
audio-normalize-downmix=yes
audio-pitch-correction=yes
volume-max=120

# ==========================================================
# Neural & Perceptual GLSL Shader Chain (ArtCNN C4F32)
# ==========================================================
glsl-shaders-append="~~/shaders/01_CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/02_ArtCNN_C4F32.glsl"
glsl-shaders-append="~~/shaders/03_SSimDownscaler.glsl"

# ==========================================================
# Conditional & Manual Profiles
# (Must always remain at the very bottom of mpv.conf)
# ==========================================================

# 1. High-FPS Guard (Lightweight pipeline on >=48fps streams)
[high-fps-guard]
profile-desc="Use lightweight pipeline with CfL only at >=48fps"
profile-cond=math.max(get("container-fps", 24), get("estimated-vf-fps", 24)) >= 48
profile-restore=copy-equal
deband=no
hdr-compute-peak=no
hdr-contrast-recovery=0
glsl-shaders="~~/shaders/01_CfL_Prediction.glsl"

# 2. Laptop Panel HDR Tone-Mapping Peak (BOE0B04 / NE160QDM-NZ2, ~300 nits typ.)
[alienware-hdr-to-sdr]
profile-desc="Set 300-nit tone-mapping peak for HDR content on 2560px displays"
profile-cond=(p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg") and get("display-width", 0) == 2560
profile-restore=copy-equal
target-peak=300

# 3. External 1080p Monitor HDR Tone-Mapping Peak (Philips 236V4 / PHLC0B3, ~250 nits typ. max)
[philips-236v4-hdr-to-sdr]
profile-desc="Set 250-nit tone-mapping peak and 8-bit dither for HDR content on 1080p <=75Hz displays"
profile-cond=(p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg") and get("display-width", 0) == 1920 and get("display-fps", 60) <= 75
profile-restore=copy-equal
target-peak=250
dither-depth=8

# 4. Dedicated HDR10+ Dynamic Metadata (Non-4K SDR Conversion Only; Heuristic DV Exclusion)
[auto-hdr10plus]
profile-desc="Use ST 2094-40 dynamic metadata for HDR10+ on non-4K SDR displays"
profile-cond=get("display-width", 0) < 3840 and p["video-params/gamma"] == "pq" and p["video-params/colormatrix"] ~= "dolbyvision" and get("video-params/dolby-vision-profile", 0) == 0 and get("video-params/scene-max-r", 0) > 0
profile-restore=copy-equal
tone-mapping=st2094-40
hdr-compute-peak=no
hdr-contrast-recovery=0.15

# 5. External 4K TV Profile (LG 55QNED82ASG 4K 120Hz — requires Windows HDR enabled)
[lg-tv-hdr-atmos]
profile-desc="Enable static HDR output hint on 4K <=120Hz displays"
profile-cond=get("display-width", 0) >= 3840 and get("display-fps", 60) <= 120
profile-restore=copy-equal
video-sync=audio
interpolation=no
deband=no
hdr-contrast-recovery=0
target-colorspace-hint=auto
target-colorspace-hint-mode=source
target-peak=auto

# 6. Minimal Processing Comparison Mode (Ctrl+Shift+R to apply / Ctrl+Shift+U to restore)
[purist-reference]
profile-restore=copy
profile-desc="Baseline comparison: ewa_lanczos, mitchell downscale, no sigmoid/recovery/shaders/deband"
scale=ewa_lanczos
cscale=spline36
dscale=mitchell
scale-antiring=0.5
cscale-antiring=0.5
sigmoid-upscaling=no
tone-mapping=spline
hdr-peak-percentile=99.995
hdr-contrast-recovery=0
deband=no
dither=fruit
dither-size-fruit=6
glsl-shaders=""
