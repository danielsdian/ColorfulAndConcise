# mpv options for Lenovo V15 G2 ITL
# Hardware: Core i5-1135G7 + Intel Iris Xe Graphics (80 EU) + 24GB DDR4-3200 MT/s
# Validated for AIOStreams Desktop 0.26.1+ (libmpv + mpv 0.42.0-dev)
# Purpose: lightweight starting point for image quality and A/B comparison.
# Facts below distinguish measured behavior from subjective preferences.
# The Iris Xe prioritizes stable frame timing over the highest-cost processing.
# Displays:
#   - Integrated Panel: BOE08D5 / NT156FHM-N61 (15.6" TN FHD 1920x1080 60Hz, 8-bit 6+FRC, ~220 nits typ.)
#   - External Monitor: HP V225hz / HWP3319 (21.5" TN FHD 1920x1080 60Hz, 8-bit 6+FRC, ~200 nits typ.)
# App Integration Notes:
#   - Video output (gpu-next with gpu fallback) is initialized by AIOStreams Desktop on Windows.
#   - Hardware decoding, audio channels, passthrough & dialogue boost are managed in AIOStreams Settings.
#   - Keep AIOStreams "Anime upscaling" OFF while custom GLSL shaders are active.
#   - Do not copy this file literally by text import: the mpv option syntax is plain text.

# ==========================================================
# Rendering & iGPU-Optimized D3D11 Pipeline
# Choice: keep the swapchain and processing modest for the Iris Xe.
# Three swapchain images balance latency/headroom on 60 Hz panels.
# This group affects timing and memory bandwidth, not source detail itself.
# ==========================================================
gpu-api=d3d11
gpu-context=d3d11
swapchain-depth=3
demuxer-thread=yes
# Verify in AIOStreams logs that this build accepts "auto". If it reports an
# invalid option, use "yes" or "no" explicitly instead.
deinterlace=auto

# ==========================================================
# Balanced Scaling & Panel-Matched Dithering
# Choice: spline36 is a balanced compromise between softness and detail.
# It avoids the very sharp Lanczos result and is more suitable for an iGPU.
# Mitchell is retained for reduction because it adds less ringing than a
# stronger reconstruction filter.
# Panel dither uses fruit because the output is 8-bit 6+FRC.
# dither-depth=auto allows mpv to select a depth based on the active output.
# ==========================================================
scale=spline36
cscale=spline36
dscale=mitchell
scale-antiring=0.5
cscale-antiring=0.5
correct-downscaling=yes
linear-downscaling=no
sigmoid-upscaling=no

dither-depth=auto
dither=fruit

# ==========================================================
# Motion & Display Sync (Fixed 60Hz Panels)
# Fidelity choice: preserve source cadence and avoid synthetic frame insertion.
# The two panels are fixed at 60 Hz, so 24 fps may show judder despite stable
# frame timing. G-SYNC/VRR is not enabled by this configuration.
# ==========================================================
video-sync=audio
interpolation=no

# ==========================================================
# Single-Pass Lightweight Debanding
# Choice: correct compressed gradients while limiting iGPU workload.
# One pass is enough to test subtle banding and reduces the risk of softening
# fine film grain. Increase only after finding a visible source defect.
# Threshold/range/grain are deliberately modest for this machine.
# ==========================================================
deband=yes
deband-iterations=1
deband-threshold=32
deband-range=16
deband-grain=4

# ==========================================================
# Color Calibration & HDR-to-SDR Tone-Mapping
# Spline is active as the unified HDR-to-SDR tone-mapping curve (1:1 below the
# knee with smooth highlight roll-off). BT.2446A remains available via Ctrl+Shift+T.
# Perceptual gamut mapping protects saturated and in-gamut detail.
# 210 nits is a compromise for the two 1920x1080 panels, not a calibrated peak.
# Replace this value only after A/B testing with the actual Windows brightness.
# ==========================================================
icc-profile-auto=no
target-colorspace-hint=no
tone-mapping=spline
gamut-mapping-mode=perceptual
hdr-compute-peak=yes
# 99.8 follows only the brightest part of the scene less conservatively than
# 99.995. Test with the pct shortcut (Ctrl+Shift+H) before choosing a final value.
hdr-peak-percentile=99.8

# ==========================================================
# Manual RAM Cache (Overrides AIOStreams 1 GiB Auto-Cache; calibrated for 24GB RAM)
# This setting is intentionally manual for long/heavy remuxes and network
# buffering. AIOStreams suppresses its automatic cache when it finds
# "demuxer-max-bytes" in mpv.conf, even in a comment.
# The values are upper limits, not RAM reserved permanently.
# 2 GiB forward / 1 GiB backward is a 24 GB-RAM starting point.
# Removing both lines restores AIOStreams automatic cache behavior.
# ==========================================================
cache=yes
cache-on-disk=no
demuxer-max-bytes=2GiB
demuxer-max-back-bytes=1GiB

# ==========================================================
# Track Preferences & Audio Downmix / Volume Safety
# Track choices and normalize-downmix are independent of channel/passthrough
# controls in AIOStreams. Normalize-downmix protects against clipping only;
# it is not a substitute for dialogue boost or night-mode processing.
# ==========================================================
alang=eng,pt-BR,por,jpn
slang=eng,pt-BR,por
subs-with-matching-audio=yes
sub-auto=fuzzy
audio-normalize-downmix=yes
# Pitch correction is relevant mainly for playback-speed changes.
audio-pitch-correction=yes
# Amplifies the player volume but cannot restore lost detail and may clip.
volume-max=120

# ==========================================================
# Lightweight GLSL Shader Chain (1080p / 720p Sources)
# This chain is optional image interpretation, not a substitute for the source.
# It is intended to help lower-resolution sources while keeping iGPU workload
# limited. Compare 720p/1080p material before applying it as a default.
# CfL: chroma reconstruction
# SGSR: lightweight spatial upscaling/super-resolution for this iGPU
# During A/B tests, keep AIOStreams "Anime upscaling" disabled to avoid stacking.
# ==========================================================
glsl-shaders-append="~~/shaders/01_CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/02_SGSR.glsl"

# ==========================================================
# Conditional & Manual Profiles
# (Must always remain at the very bottom of mpv.conf)
# Profiles are evaluated in priority order; copy-equal modes preserve runtime
# restoration behavior. A profile will never prove itself superior by
# naming alone: compare with visible 1080p/4K representative scenes.
# ==========================================================

# 1. Native 4K Bypass (Validated: cuts Iris Xe 4K DV render time from ~42.3 ms to ~28.0 ms)
# Purpose: preserve 23.976 fps timing on 4K sources in the tested 4K DV case.
# With Mitchell/correct-downscaling in this profile, render time reached
# ~42.3 ms and showed 49 dropped frames. Bilinear/correct-downscaling=no
# reached ~28.0 ms and preserved smooth playback.
# This is a deliberate quality/performance trade-off: no shaders/deband/peak
# detection and the simpler bilinear reduction.
[4k-native]
profile-desc="Bypass shaders, deband, peak compute and heavy scaling on 4K content"
profile-cond=get("video-params/w", 0) >= 3840
profile-restore=copy-equal
deband=no
hdr-compute-peak=no
scale=bilinear
cscale=bilinear
dscale=bilinear
correct-downscaling=no
glsl-shaders-clr

# 2. High-FPS Guard (Lightweight pipeline on >=48fps streams)
# Purpose: reduce expensive processing when FPS is 48 or higher.
# It removes debanding, peak detection and the shader chain.
# The FPS condition is a heuristic because estimated/container FPS can differ.
[high-fps-guard]
profile-desc="Disable deband, peak compute and shaders on >=48fps streams"
profile-cond=math.max(get("container-fps", 24), get("estimated-vf-fps", 24)) >= 48
profile-restore=copy-equal
deband=no
hdr-compute-peak=no
glsl-shaders-clr

# 3. Laptop & HP External Monitor HDR Tone-Mapping Peak (BOE08D5 ~220 / HWP3319 ~200 nits)
# Purpose: approximate HDR-to-SDR conversion for both 1920x1080 panels.
# 210 nits is a compromise between ~220 and ~200 nit panel characteristics,
# not a calibrated per-window measurement.
# Resolution/fps does not identify the exact monitor model.
[hdr-to-sdr]
profile-desc="Set 210-nit compromise tone-mapping peak for HDR content on BOE08D5/HWP3319"
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy-equal
target-peak=210

# 4. Dedicated HDR10+ Dynamic Metadata (Heuristic Dolby Vision Exclusion)
# Purpose: honor HDR10+ dynamic metadata when a positive profile can be found.
# This heuristic excludes the Dolby Vision path before selecting ST 2094-40.
# It was tested for non-triggering behavior in hybrid DV streams, but a positive
# HDR10+ test is still needed for full validation.
[auto-hdr10plus]
profile-desc="Use ST 2094-40 dynamic metadata for HDR10+ when no Dolby Vision profile is reported"
profile-cond=p["video-params/gamma"] == "pq" and p["video-params/colormatrix"] ~= "dolbyvision" and get("current-tracks/video/dolby-vision-profile", 0) == 0 and get("video-params/scene-max-r", 0) > 0
profile-restore=copy-equal
tone-mapping=st2094-40
hdr-compute-peak=no

# 5. Minimal Processing Comparison Mode (Ctrl+Shift+R to apply / Ctrl+Shift+U to restore)
# Purpose: compare a minimally processed image against the normal chain.
# This is a no-calibration comparison profile, not a "studio reference".
# It does not mean "more faithful" by itself: less sharpening/debanding may
# reveal source compression, grain or banding that was previously hidden.
# profile-restore=copy lets Ctrl+Shift+U restore values from immediately before
# applying this profile. Reopen/reload if a conditional profile must re-evaluate.
[purist-reference]
profile-restore=copy
profile-desc="Minimal processing: spline tone-mapping, no shaders, no deband"
tone-mapping=spline
hdr-peak-percentile=99.995
deband=no
glsl-shaders-clr
