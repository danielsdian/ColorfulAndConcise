# mpv options for Lenovo V15 G2 ITL (i5-1135G7 + Iris Xe + 24 GB RAM)
# Validated for AIOStreams Desktop / SELection (libmpv + gpu-next)
# Displays:
#   - Integrated Panel: BOE08D5 / NT156FHM-N61 (1080p 60Hz, ~220 nits typ. @ 100% brightness)
#   - External Monitor: HP V225hz / HWP3319 (1080p 60Hz, ~250 nits typ. max -> ~190-200 nits @ 75% OSD)
# Audio: Integrated Speakers & Samsung Galaxy Buds 3 Pro

# ==========================================================
# Rendering & Hardware Decoding (Intel QuickSync / Iris Xe)
# ==========================================================
vo=gpu-next
# gpu-next/libplacebo rendering pipeline; explicit D3D11 output for Windows.
gpu-api=d3d11
gpu-context=d3d11
hwdec=d3d11va
demuxer-thread=yes
# Let mpv enable deinterlacing only when the stream is actually interlaced.
deinterlace=auto

# ==========================================================
# Balanced iGPU Scaling & Dithering
# ==========================================================
scale=spline36
cscale=lanczos
dscale=mitchell
# Conservative antiringing: avoid halos while retaining edge detail.
scale-antiring=0.6
cscale-antiring=0.6
correct-downscaling=yes
linear-downscaling=no
sigmoid-upscaling=no

dither-depth=auto
# Ordered fruit dithering avoids the compute-shader cost of error diffusion on Iris Xe.
dither=fruit

# ==========================================================
# Motion & Display Sync (60 Hz Integrated BOE08D5 & HP V225hz)
# ==========================================================
video-sync=audio
interpolation=no

# ==========================================================
# Lightweight Selective Debanding (Sub-4K Content incl. 8-bit Streams)
# ==========================================================
deband=yes
# Two lightweight passes, moderate threshold and grain for streamed content.
deband-iterations=2
deband-threshold=28
deband-range=12
deband-grain=6

# ==========================================================
# Color Calibration & HDR/DV -> SDR Tone-Mapping (SDR default; PQ/HLG peak in profile)
# ==========================================================
icc-profile-auto=no
target-colorspace-hint=no
tone-mapping=bt.2446a
gamut-mapping-mode=perceptual
# Dynamic HDR peak detection; 99.8 ignores extreme isolated highlights.
hdr-compute-peak=yes
hdr-peak-percentile=99.8

# ==========================================================
# In-Memory Demuxer Cache Limits (Up to 2.5 GiB of 24 GB RAM, No Disk Cache)
# ==========================================================
cache=yes
cache-on-disk=no
# Packet cache limited to 2 GiB ahead + 512 MiB behind, all in RAM.
demuxer-max-bytes=2GiB
demuxer-max-back-bytes=512MiB

# ==========================================================
# Audio & Subtitles (Speakers + Galaxy Buds 3 Pro, EN Primary)
# ==========================================================
alang=eng,pt-BR,por
slang=eng,pt-BR,por
subs-with-matching-audio=yes
sub-auto=fuzzy

audio-channels=stereo
audio-normalize-downmix=yes
# 1.0 dB is intentional: slight center/dialogue emphasis on laptop speakers.
# It is effective only when libswresample performs the downmix.
audio-swresample-o=center_mix_level=1.0
audio-pitch-correction=yes
volume-max=120

# ==========================================================
# Shader Pipeline (Active below 4K; Bypassed in 4K)
# ==========================================================
glsl-shaders-append="~~/shaders/01_CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/02_SGSR.glsl"

# ==========================================================
# Conditional Auto-Profiles
# (Must always remain at the very bottom of mpv.conf)
# ==========================================================

# 1. Native 4K Bypass (Preserves 60Hz headroom on Iris Xe)
[4k-native]
profile-desc="Bypass custom shaders, deband and dynamic peak compute on 4K content for Iris Xe"
profile-cond=get("video-params/w", 0) >= 3840
profile-restore=copy-equal
# Source is 4K: remove GPU-heavy shaders/deband/peak compute to preserve frame time.
deband=no
hdr-compute-peak=no
glsl-shaders-clr

# 2. High-FPS Guard (Heuristic switch to chroma-only shader, no deband/peak compute at >=48fps)
[high-fps-guard]
profile-desc="Keep only CfL, bypass deband and peak compute at >=48fps"
profile-cond=math.max(get("container-fps", 24), get("estimated-vf-fps", 24)) >= 48 and get("video-params/w", 0) < 3840
profile-restore=copy-equal
# At 48 fps+ the chroma-only pass is enough; remove deband and HDR histogram work.
deband=no
hdr-compute-peak=no
glsl-shaders-clr
glsl-shaders-append="~~/shaders/01_CfL_Prediction.glsl"

# 3. HDR -> SDR Tone-Mapping Peak (210-nit estimate for BOE08D5 @ 100% & HP V225hz @ 75% OSD)
[hdr-to-sdr]
profile-desc="Set 210-nit tone-mapping peak on HDR (PQ/HLG) sources for ~200-220 nit panels"
profile-cond=(p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg")
profile-restore=copy-equal
# Spec-based estimate (~220 nits BOE08D5 @ 100%; ~190-200 nits HP V225hz @ 75% OSD).
target-peak=210

# 4. Dedicated HDR10+ Dynamic Metadata (Heuristic Dolby Vision Exclusion for Hybrid Streams)
[auto-hdr10plus]
profile-desc="Use ST 2094-40 dynamic metadata for HDR10+ when no Dolby Vision profile is reported"
profile-cond=p["video-params/gamma"] == "pq" and p["video-params/colormatrix"] ~= "dolbyvision" and get("current-tracks/video/dolby-vision-profile", 0) == 0 and get("video-params/scene-max-r", 0) > 0
profile-restore=copy-equal
# Heuristic: avoid HDR10+ mapping when content reports Dolby Vision metadata.
tone-mapping=st2094-40
hdr-compute-peak=no
